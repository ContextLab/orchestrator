
name: network_test_pipeline
version: "1.0"
description: Test pipeline for network failure scenarios

steps:
  - id: web_request
    action: web_request
    parameters:
      url: "http://this-domain-definitely-does-not-exist-12345.com/api"
      timeout: 10
      method: "GET"
    outputs:
      - response_data
  
  - id: process_response
    action: python_code
    parameters:
      code: |
        import json
        print(f"Received response: {response_data}")
        result = json.loads(response_data) if response_data else {"error": "no data"}
    depends_on:
      - web_request
