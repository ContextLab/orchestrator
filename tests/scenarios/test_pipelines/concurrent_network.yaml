
name: concurrent_network_test
version: "1.0"

steps:
  - id: concurrent_requests
    action: parallel
    parameters:
      max_concurrent: 10
      tasks:
        - action: web_request
          parameters:
            url: "http://localhost:57488/test1"
            timeout: 10
        - action: web_request
          parameters:
            url: "http://localhost:57488/test2"  
            timeout: 10
        - action: web_request
          parameters:
            url: "http://localhost:57488/test3"
            timeout: 10
        - action: web_request
          parameters:
            url: "http://localhost:57488/test4"
            timeout: 10
        - action: web_request
          parameters:
            url: "http://localhost:57488/test5"
            timeout: 10
