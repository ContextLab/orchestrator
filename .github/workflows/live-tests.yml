name: Live provider and integration tests

# These cost money and need credentials, so they never run on push or PR.
# Provider support may only be claimed in the README when this workflow is
# green (see docs/adr/0001-product-contract.md).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  ORCHESTRATOR_AUTO_INSTALL: "0"

jobs:
  integration:
    name: Integration tests (local services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with infrastructure extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[infra]"
          python -m pip install pytest pytest-asyncio pytest-timeout

      - name: Run integration tests
        env:
          ORCHESTRATOR_RUN_INTEGRATION: "1"
        run: python -m pytest -m "integration and not live" -q

  live-anthropic:
    name: Live Anthropic provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the anthropic extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[anthropic]"
          python -m pip install pytest pytest-asyncio pytest-timeout

      - name: Run live-provider tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_API_KEY is not configured; cannot verify live provider support."
            exit 1
          fi
          python -m pytest -m live -q
