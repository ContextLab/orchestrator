name: Live provider and integration tests

# These cost money and need credentials, so they never run on push or PR.
# Provider support may only be claimed in the README when this workflow is
# green (see docs/adr/0001-product-contract.md).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  ORCHESTRATOR_AUTO_INSTALL: "0"

jobs:
  integration:
    name: Integration tests (local services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with infrastructure extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[infra]"
          python -m pip install pytest pytest-asyncio pytest-timeout

      - name: Run integration tests
        env:
          ORCHESTRATOR_RUN_INTEGRATION: "1"
        run: python -m pytest -m "integration and not live" -q

  # There is no live-anthropic job: Anthropic is not a provider of this
  # product (ADR 0001, decided 2026-08-21). The frozen adapter retires under
  # #430. The next live job to add is live-huggingface, with the provider
  # itself (#484).

  live-dartmouth:
    name: Live Dartmouth provider (free models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No provider extra: the gateway is OpenAI-compatible and the
          # adapter speaks it with aiohttp, which is already a core dependency.
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-timeout

      - name: Run live Dartmouth tests
        env:
          DARTMOUTH_CHAT_API_KEY: ${{ secrets.DARTMOUTH_CHAT_API_KEY }}
          ORCHESTRATOR_REQUIRE_LIVE: "1"
        run: |
          if [ -z "${DARTMOUTH_CHAT_API_KEY}" ]; then
            echo "DARTMOUTH_CHAT_API_KEY is not configured; cannot verify Dartmouth support."
            exit 1
          fi
          python -m pytest -m live -k dartmouth -v | tee dartmouth-live.txt
          # A missing credential is already a hard error via
          # ORCHESTRATOR_REQUIRE_LIVE, but every free model can legitimately be
          # down at once, in which case every test skips and the job would
          # otherwise pass having proved nothing. Require real passes.
          grep -qE "[1-9][0-9]* passed" dartmouth-live.txt \
            || { echo "No Dartmouth live test actually passed; coverage is not real."; exit 1; }
